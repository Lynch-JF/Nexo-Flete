<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo Flete · Tarifas &amp; Parámetros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --sidebar:#0F172A;
    --primary:#0F766E;
    --primary-hover:#115E59;
    --text:#0F172A;
    --secondary:#64748B;
    --border:#E2E8F0;

    --primary-tint:#0F766E14;
    --danger:#B45309;
    --danger-tint:#B450391a;
    --good:#0F766E;
    --amber-tint:#D9770614;
    --amber:#B45309;

    --sidebar-text:#CBD5E1;
    --sidebar-text-dim:#64748B;
    --sidebar-active-bg:#0F766E;
    --sidebar-active-text:#FFFFFF;

    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button, input, select{font-family:inherit;}

  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px; flex:0 0 248px; background:var(--sidebar);
    padding:24px 16px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 28px;}
  .brand-mark{width:32px; height:32px; border-radius:8px; background:linear-gradient(155deg, var(--primary) 0%, #0B4F49 100%); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px; color:#fff; flex:none;}
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:17px; color:#fff;}
  .brand-sub{font-size:11px; color:var(--sidebar-text-dim); margin-top:1px;}
  .nav-group-label{font-size:11px; color:var(--sidebar-text-dim); padding:14px 12px 6px; font-weight:600;}
  nav.primary-nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; font-size:13.5px; color:var(--sidebar-text); text-decoration:none; font-weight:500; transition:background .12s ease, color .12s ease;}
  .nav-item:hover{background:#1E293B; color:#fff;}
  .nav-item.active{background:var(--sidebar-active-bg); color:var(--sidebar-active-text);}
  .nav-item svg{flex:none; opacity:0.9;}
  .sidebar-footer{margin-top:auto; padding-top:16px; border-top:1px solid #1E293B;}
  .user-chip{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;}
  .user-avatar{width:30px; height:30px; border-radius:50%; background:#1E293B; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; flex:none;}
  .user-name{font-size:13px; color:#fff; font-weight:600;}
  .user-role{font-size:11.5px; color:var(--sidebar-text-dim);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:28px 36px 80px;}

  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:22px; flex-wrap:wrap;}
  .page-title{font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em;}
  .page-sub{color:var(--secondary); font-size:13.5px; margin:0; max-width:52ch;}

  .btn{display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-size:13.5px; font-weight:600; border-radius:8px; padding:9px 16px; transition:background .12s ease, border-color .12s ease;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:#CBD5E1;}
  .btn-sm{padding:6px 12px; font-size:12px;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:12px;}

  /* Category tabs */
  .tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:0;}
  .tab-btn{
    border:none; background:transparent; cursor:pointer;
    padding:10px 4px; margin-right:18px;
    font-size:13.5px; font-weight:600; color:var(--secondary);
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--primary); border-bottom-color:var(--primary);}
  .tab-btn:hover:not(.active){color:var(--text);}

  .tab-panel{display:none;}
  .tab-panel.visible{display:block;}

  .layout{display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start;}

  .panel{padding:20px 22px 22px;}
  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;}
  .panel-title{font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 3px;}
  .panel-title-sub{font-size:12px; color:var(--secondary); margin:0;}

  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
  thead th{text-align:left; font-size:11px; font-weight:600; color:var(--secondary); padding:0 10px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .cell-primary{font-weight:600;}
  .cell-sub{display:block; font-size:11.5px; color:var(--secondary); font-weight:400; margin-top:1px;}

  .status-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:11.5px; font-weight:600;}
  .status-vigente{background:var(--primary-tint); color:var(--primary);}
  .status-historico{background:#64748B14; color:var(--secondary);}
  .status-programado{background:var(--amber-tint); color:var(--amber);}

  .row-muted td{color:var(--secondary);}

  .icon-btn{border:none; background:transparent; color:var(--secondary); cursor:pointer; width:26px; height:26px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--primary-tint); color:var(--primary);}

  .show-history{font-size:12px; color:var(--primary); font-weight:600; background:none; border:none; cursor:pointer; padding:0;}

  /* Side form */
  .side-panel{position:sticky; top:24px;}
  .side-title{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 3px;}
  .side-sub{font-size:12px; color:var(--secondary); margin:0 0 16px; line-height:1.5;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12.5px; font-weight:600;}
  .input{border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13.5px; color:var(--text); background:#fff; width:100%; outline:none; transition:border-color .12s ease, box-shadow .12s ease;}
  .input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);}
  .input-suffix-wrap{position:relative;}
  .input-suffix-wrap .input{padding-right:52px;}
  .input-suffix{position:absolute; right:1px; top:1px; bottom:1px; display:flex; align-items:center; padding:0 12px; font-size:12px; color:var(--secondary); font-weight:600; background:#F1F5F9; border-left:1px solid var(--border); border-radius:0 7px 7px 0;}

  .vigencia-note{
    display:flex; gap:9px; padding:11px 12px; border-radius:8px;
    background:var(--amber-tint); color:var(--amber);
    font-size:12px; line-height:1.5; margin-top:2px; margin-bottom:16px;
  }
  .vigencia-note svg{flex:none; margin-top:1px;}

  .btn-block{width:100%; justify-content:center;}

  @media (max-width: 1180px){
    .layout{grid-template-columns:1fr;}
    .side-panel{position:static;}
  }
  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex:none; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto; padding:14px 16px;}
    .brand{padding:0 16px 0 0;}
    .nav-group-label{display:none;}
    nav.primary-nav{flex-direction:row; gap:4px;}
    .nav-item span{display:none;}
    .sidebar-footer{display:none;}
    .main{padding:20px 18px 60px;}
  }
  @media (max-width: 480px){
    .page-title{font-size:22px;}
  }
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#0F172A;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:340px;box-shadow:0 8px 24px #0f172a40}.toast.err{background:#B45309}
.empty{padding:26px 10px;text-align:center;color:var(--secondary);font-size:13px}
.btn:disabled{opacity:.6;cursor:not-allowed}a.btn{text-decoration:none}
@media(max-width:860px){.sidebar-footer{display:flex;margin-left:auto;border:0;padding:0}.sidebar-footer .user-chip{display:none}}
</style>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">NF</div>
      <div>
        <div class="brand-name">Nexo Flete</div>
        <div class="brand-sub">Costeo &amp; Logística</div>
      </div>
    </div>

    <div class="nav-group-label">Operación</div>
    <nav class="primary-nav">
      <a class="nav-item" href="sujumi-dashboard.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Panel</span>
      </a>
      <a class="nav-item" href="sujumi-registrar-viaje.html">

      <a class="nav-item" href="sujumi-comparacion.html">

        <span>Comparación</span>

    <div class="nav-group-label">Parámetros</div>

        <span>Tarifas &amp; costos</span>

        <span>Vehículos</span>
      </a>
      <a class="nav-item" href="sujumi-tarifas-parametros.html#transportistas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3H5a2 2 0 0 0-2 2v14l4-3h9a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg>
        <span>Transportistas</span>
      </a>
      </nav>

    <div class="sidebar-footer">
      <a class="nav-item" href="#" id="logout" style="margin-bottom:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Cerrar sesión</span></a>
      <div class="user-chip">
        <div class="user-avatar" id="uAv"></div>
        <div>
          <div class="user-name" id="uName"></div>
          <div class="user-role" id="uRole"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
<div class="topbar"><div><h1 class="page-title">Tarifas &amp; Parámetros</h1><p class="page-sub">Datos estables que alimentan el cálculo del costo. Cada cambio queda registrado con fecha de vigencia — el histórico nunca se modifica.</p></div></div>
<div class="tabs" id="tabs"><button class="tab-btn" data-tab="hora-km">Costo por hora / km</button><button class="tab-btn" data-tab="vehiculos">Vehículos</button><button class="tab-btn" data-tab="transportistas">Transportistas externos</button><button class="tab-btn" data-tab="salarios">Salarios &amp; cargas laborales</button><button class="tab-btn" data-tab="zonas">Zonas &amp; rutas</button><button class="tab-btn" data-tab="personal">Personal</button><button class="tab-btn" data-tab="usuarios">Usuarios</button></div><div id="view"></div></main>

</div>



<script>
(async()=>{const S=window.S;if(!S)return;S.init();const {api,esc,money,toast}=S,$=id=>document.getElementById(id);

const adm=S.user&&S.user.rol==='admin_costeo';
if(!adm)document.querySelector('[data-tab="usuarios"]').remove();
const MOD={por_viaje:'Por viaje',por_bulto:'Por bulto',por_zona:'Por zona',por_peso:'Por peso',por_volumen:'Por volumen',especial:'Tarifa especial'};
const TIPO={hora:'Costo por hora',km:'Costo por kilómetro',hora_extra:'Costo por hora extra'};
let Z=[],TR=[],RL=[],cur=(location.hash||'#hora-km').slice(1);
const zn=id=>id==null?'Todas':(Z.find(z=>z.id==id)||{nombre:'#'+id}).nombre,tn=id=>(TR.find(t=>t.id==id)||{nombre:'#'+id}).nombre;
const mins=m=>{m=+m;return m>=60?`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}min`:m+'min'};
const N=v=>`<td class="mono">${money(v)}</td>`,P=s=>`<td class="cell-primary">${s}</td>`;
const T={
'hora-km':{p:'/costos-operacion',h:['Parámetro','Valor'],c:r=>[P(TIPO[r.tipo]||esc(r.tipo)),N(r.valor)],f:{t:'Nuevo valor vigente',fl:[['tipo','Parámetro','select',Object.entries(TIPO)],['valor','Nuevo valor','num','RD$']]}},
'vehiculos':{p:'/vehiculos',h:['Vehículo','Depreciación/mes','Seguro/mes','Mantenim. est./mes','Rendimiento'],c:r=>[P(`${esc(r.nombre)}<span class="cell-sub">Placa ${esc(r.placa)}</span>`),N(r.depreciacion_mensual),N(r.seguro_mensual),N(r.mantenimiento_estimado_mensual),`<td class="mono">${+r.rendimiento_km_gal} km/gal</td>`],x:{activo:true},f:{t:'Nuevo vehículo',fl:[['placa','Placa','text'],['nombre','Nombre del vehículo','text'],['depreciacion_mensual','Depreciación mensual','num','RD$'],['seguro_mensual','Seguro mensual','num','RD$'],['mantenimiento_estimado_mensual','Mantenimiento estimado mensual','num','RD$'],['rendimiento_km_gal','Rendimiento de combustible','num','km/gal']]}},
'transportistas':{p:'/tarifas-transportista',h:['Transportista','Modalidad','Tarifa','Zona'],c:r=>[P(esc(tn(r.transportista_id))),`<td>${MOD[r.modalidad]||esc(r.modalidad)}</td>`,N(r.valor),`<td>${esc(zn(r.zona_id))}</td>`],f:{t:'Nueva tarifa de transportista',fl:[['transportista_id','Transportista','select',()=>[...TR.map(t=>[t.id,t.nombre]),['new','+ Nuevo transportista']]],['nuevo','Nombre del nuevo transportista','text'],['modalidad','Modalidad','select',Object.entries(MOD)],['zona_id','Zona','select',()=>[['','Todas las zonas'],...Z.map(z=>[z.id,z.nombre])]],['valor','Tarifa','num','RD$']]}},
'salarios':{p:'/roles-laborales',h:['Rol','Salario mensual','Cargas laborales','Costo hora-hombre'],c:r=>[P(esc(r.rol)),N(r.salario_mensual),`<td class="mono">${+r.cargas_laborales_pct}%</td>`,N(r.costo_hora_hombre)],f:{t:'Nuevo valor de rol',fl:[['rol','Rol','text'],['salario_mensual','Salario mensual','num','RD$'],['cargas_laborales_pct','Cargas laborales','num','%']]}},
'personal':{p:'/personal',nv:1,h:['Nombre','Rol','Estado'],c:r=>[P(esc(r.nombre)),`<td>${esc(r.rol||'—')}</td>`,`<td><span class="status-pill status-${r.activo?'vigente':'historico'}">${r.activo?'Activo':'Inactivo'}</span></td>`],f:{t:'Nuevo empleado',fl:[['nombre','Nombre','text'],['rol_laboral_id','Rol','select',()=>RL.map(r=>[r.id,r.rol])]]}},
'usuarios':{p:'/usuarios',nv:1,h:['Usuario','Rol','Estado','Acciones'],c:r=>{const me=r.id==S.user.id,bs='style="padding:5px 10px;font-size:12px"';return [P(esc(r.usuario)+(me?'<span class="cell-sub">Tú</span>':'')),
 `<td>${me?'Administrador':`<select class="input" data-rol="${r.id}" style="padding:5px 8px;width:auto"><option value="admin_costeo"${r.rol==='admin_costeo'?' selected':''}>Administrador</option><option value="operador"${r.rol==='operador'?' selected':''}>Operador</option></select>`}</td>`,
 `<td><span class="status-pill status-${r.activo?'vigente':'historico'}">${r.activo?'Activo':'Inactivo'}</span></td>`,
 `<td>${me?'':`<button class="btn btn-ghost" ${bs} data-pw="${r.id}">Contraseña</button> <button class="btn btn-ghost" ${bs} data-act="${r.id}" data-to="${!r.activo}">${r.activo?'Desactivar':'Activar'}</button>`}</td>`]},
 f:{t:'Nuevo usuario',fl:[['usuario','Usuario','text'],['password','Contraseña (mín. 8 caracteres)','pass'],['rol','Rol','select',[['operador','Operador'],['admin_costeo','Administrador']]]]}},
'zonas':{p:'/zonas',h:['Zona','Distancia estándar','Tiempo estándar'],c:r=>[P(esc(r.nombre)),`<td class="mono">${+r.distancia_estandar_km} km</td>`,`<td class="mono">${mins(r.tiempo_estandar_min)}</td>`],f:{t:'Nueva zona',fl:[['nombre','Nombre de la zona','text'],['distancia_estandar_km','Distancia estándar','num','km'],['tiempo_estandar_min','Tiempo estándar','num','min']]}}
};
const fld=([k,l,t,o])=>{let i;
  if(t==='select')i=`<select class="input" name="${k}">${(typeof o==='function'?o():o).map(([v,x])=>`<option value="${esc(v)}">${esc(x)}</option>`).join('')}</select>`;
  else{i=`<input class="input" name="${k}" ${t==='num'?'type="number" step="any" min="0"':t==='pass'?'type="password" minlength="8" autocomplete="new-password"':'type="text"'} ${k==='nuevo'?'':'required'}>`;if(t==='num')i=`<div class="input-suffix-wrap">${i}<span class="input-suffix">${o}</span></div>`}
  return `<div class="field" ${k==='nuevo'?'id="fNuevo" style="display:none"':''}><label>${l}</label>${i}</div>`};
async function render(){
  if(!T[cur])cur='hora-km';const d=T[cur];
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===cur));
  $('view').innerHTML='<div class="empty">Cargando…</div>';
  let rows;try{[Z,TR,RL]=await Promise.all([api('/zonas'),api('/transportistas?incluirInactivos=1'),api('/roles-laborales').catch(()=>[])]);rows=d.nv?await api(d.p+'?incluirInactivos=1'):await api(d.p+'/historial').catch(()=>api(d.p))}catch(e){$('view').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const td=S.today(),f=d.f;
  const body=rows.map(r=>{const v=!r.vigente_hasta,pr=v&&String(r.vigente_desde).slice(0,10)>td,s=pr?'programado':v?'vigente':'historico';
    return `<tr class="${v?'':'row-muted'}">${d.c(r).join('')}${d.nv?'':`<td class="mono">${S.fdate(r.vigente_desde)}</td><td><span class="status-pill status-${s}">${pr?'Programado':v?'Vigente':'Histórico'}</span></td>`}</tr>`}).join('')||'<tr><td colspan="9" class="empty">Sin registros</td></tr>';
  const form=adm?`<aside class="card panel side-panel"><h3 class="side-title">${f.t}</h3><p class="side-sub">${d.nv?'':'La vigencia inicia hoy; el valor anterior se cierra automáticamente y el histórico no se modifica.'}</p><form id="frm">${f.fl.map(fld).join('')}<button class="btn btn-primary btn-block" style="margin-top:8px">Guardar</button></form></aside>`:`<aside class="card panel side-panel"><h3 class="side-title">Solo lectura</h3><p class="side-sub">Únicamente el rol admin_costeo puede modificar parámetros.</p></aside>`;
  $('view').innerHTML=`<div class="layout"><section class="card panel"><div class="table-scroll"><table><thead><tr>${(d.nv?d.h:[...d.h,'Vigente desde','Estado']).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></section>${form}</div>`;
  if(cur==='usuarios'){const v=$('view'),pt=async(id,b,m)=>{try{await api('/usuarios/'+id,{method:'PATCH',body:b});toast(m)}catch(e){toast(e.message,'err')}render()};
    v.onclick=e=>{const a=e.target.closest('[data-act]'),p=e.target.closest('[data-pw]');
      if(a)pt(a.dataset.act,{activo:a.dataset.to==='true'},'Usuario actualizado');
      if(p){const w=prompt('Nueva contraseña (mínimo 8 caracteres)');if(w)pt(p.dataset.pw,{password:w},'Contraseña actualizada')}};
    v.onchange=e=>{const x=e.target.closest('[data-rol]');if(x)pt(x.dataset.rol,{rol:x.value},'Rol actualizado')}}
  const fm=$('frm');if(!fm)return;
  const sel=fm.elements.transportista_id;if(sel)sel.onchange=()=>$('fNuevo').style.display=sel.value==='new'?'':'none';
  fm.onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(fm)),b=fm.querySelector('button');
    f.fl.filter(x=>x[2]==='num').forEach(x=>fd[x[0]]=Number(fd[x[0]]));b.disabled=true;
    try{
      if(cur==='transportistas'){
        if(fd.transportista_id==='new'){if(!(fd.nuevo||'').trim())throw new Error('Escribe el nombre del transportista');fd.transportista_id=(await api('/transportistas',{method:'POST',body:{nombre:fd.nuevo.trim()}})).id}
        fd.transportista_id=+fd.transportista_id;fd.zona_id=fd.zona_id===''?null:+fd.zona_id}
      if(cur==='personal')fd.rol_laboral_id=+fd.rol_laboral_id;delete fd.nuevo;await api(d.p,{method:'POST',body:{...fd,...(d.x||{})}});toast('Nueva vigencia guardada');render();
    }catch(er){toast(er.message,'err');b.disabled=false}};
}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab});
window.addEventListener('hashchange',()=>{cur=location.hash.slice(1);render()});render();
})();
</script>
</body>
</html>
